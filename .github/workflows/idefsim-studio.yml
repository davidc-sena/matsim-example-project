# Compila os executáveis do IDEF-SIM Studio para Windows, macOS e Linux.
#
# - Em cada push que altere idefsim-studio/, os pacotes ficam disponíveis em
#   "Actions" > execução > "Artifacts".
# - Ao enviar uma tag "idefsim-v*" (ex.: idefsim-v0.1.0), é criado um Release
#   público com os pacotes anexados. O mesmo acontece ao rodar o workflow
#   manualmente informando a "versao".
# - Ao publicar um Release manualmente no GitHub, os pacotes também são anexados.
# - Também pode ser executado manualmente (Actions > Run workflow).
name: IDEF-SIM Studio - executáveis

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar como Release (ex.: 0.1.0). Deixe vazio para só compilar."
        required: false
        default: ""
  push:
    branches: ["**"]
    tags: ["idefsim-v*"]   # filtros de caminho não se aplicam a tags
    paths:
      - "idefsim-studio/**"
      - ".github/workflows/idefsim-studio.yml"
  release:
    types: [published]

permissions:
  contents: write

defaults:
  run:
    working-directory: idefsim-studio
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            package: IDEF-SIM-Studio-windows-x64.zip
          - name: macOS (Apple Silicon)
            os: macos-latest
            package: IDEF-SIM-Studio-macos-arm64.dmg
          - name: macOS (Intel)
            os: macos-15-intel
            package: IDEF-SIM-Studio-macos-x64.dmg
          - name: Linux (x64)
            os: ubuntu-22.04   # glibc mais antiga = compatível com mais distribuições
            package: IDEF-SIM-Studio-linux-x64.tar.gz
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotecas de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-shape0 libxcb-randr0 libxcb-xkb1 libfontconfig1 libdbus-1-3 xvfb

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pytest

      - name: Testes
        run: python -m pytest -q

      - name: Compilar (PyInstaller)
        run: pyinstaller --noconfirm packaging/idefsim_studio.spec

      - name: Teste de arranque (Linux, com servidor X virtual)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          set +e
          xvfb-run -a timeout 10 "dist/IDEF-SIM Studio/IDEF-SIM Studio" examples/montagem.idefsim
          code=$?
          if [ "$code" != "124" ]; then echo "O programa terminou com código $code"; exit 1; fi

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/IDEF-SIM Studio" -DestinationPath "${{ matrix.package }}"

      - name: Empacotar (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg
          cp -R "dist/IDEF-SIM Studio.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "IDEF-SIM Studio" -srcfolder dmg -ov -format UDZO "${{ matrix.package }}"

      - name: Empacotar (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.package }}" -C dist "IDEF-SIM Studio"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: idefsim-studio/${{ matrix.package }}
          if-no-files-found: error

      - name: Anexar ao Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.package }}" --clobber

  release:
    name: Publicar Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/idefsim-v') || (github.event_name == 'workflow_dispatch' && inputs.versao != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true

      - name: Criar Release com os executáveis
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.versao != '' && format('idefsim-v{0}', inputs.versao) || github.ref_name }}
        run: |
          ls -la pacotes
          VERSAO="${TAG#idefsim-v}"
          cat > notas.md <<NOTAS
          ## IDEF-SIM Studio ${VERSAO}

          Ferramenta desktop para criar, documentar, validar e simular modelos conceituais na técnica **IDEF-SIM** (simulação a eventos discretos).

          ### Downloads

          | Sistema | Arquivo |
          |---|---|
          | Windows 10/11 (64 bits) | \`IDEF-SIM-Studio-windows-x64.zip\` |
          | macOS com chip Apple (M1–M4) | \`IDEF-SIM-Studio-macos-arm64.dmg\` |
          | macOS Intel | \`IDEF-SIM-Studio-macos-x64.dmg\` |
          | Linux 64 bits (Ubuntu 22.04+ e similares) | \`IDEF-SIM-Studio-linux-x64.tar.gz\` |

          ### Como instalar

          - **Windows:** extraia o .zip e execute \`IDEF-SIM Studio.exe\`. Se o SmartScreen avisar, clique em *Mais informações* → *Executar assim mesmo*.
          - **macOS:** abra o .dmg e arraste o app para *Aplicativos*. Na primeira vez, clique com o botão direito no app → *Abrir* → *Abrir*.
          - **Linux:** \`tar -xzf IDEF-SIM-Studio-linux-x64.tar.gz\` e execute \`IDEF-SIM Studio/IDEF-SIM Studio\`.

          Os executáveis não têm assinatura digital paga; por isso o sistema pode mostrar um aviso na primeira execução.
          NOTAS
          sed -i 's/^          //' notas.md
          gh release create "$TAG" pacotes/* \
            --repo "${{ github.repository }}" \
            --title "IDEF-SIM Studio ${VERSAO}" \
            --notes-file notas.md \
            --target "${{ github.sha }}"   # cria a tag se ainda não existir
